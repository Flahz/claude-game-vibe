# Publishes Bubble Pop Safari to GitHub Pages on every push to main.
# First run enables Pages for the repository (source: GitHub Actions).
# The game is then live at https://flahz.github.io/claude-game-vibe/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site (only the files the game needs)
        run: |
          mkdir -p _site/art
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp art/*.webp _site/art/
          touch _site/.nojekyll
          ls -R _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
