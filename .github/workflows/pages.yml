# Publishes Bubble Pop Safari to GitHub Pages on every push to main.
# The game files are pushed to the gh-pages branch, which GitHub Pages serves at
# https://flahz.github.io/claude-game-vibe/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site (only the files the game needs)
        run: |
          mkdir -p _site/art
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp art/*.webp _site/art/
          touch _site/.nojekyll
          ls -R _site

      - name: Publish to the gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
