<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubble Pop">
<meta name="theme-color" content="#ff7a1f">
<meta name="format-detection" content="telephone=no">
<title>Bubble Pop Safari</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --orange:#ff7a1f; --green:#2fd15f; --pink:#ff4fa3; --ink:#2b2b45;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#6fd6ff; touch-action:manipulation; }
body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; position:fixed; inset:0; color:var(--ink); }
#app{ position:fixed; top:0; left:0; right:0; bottom:0; inset:0; overflow:hidden; background:linear-gradient(#6fd6ff 0%, #b9efff 60%, #c6f5bd 100%); }
#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

.screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 14px) calc(var(--sal) + 12px); }
.screen.on{ display:flex; }

.btn{ border:none; border-radius:999px; min-width:88px; min-height:88px; font-size:44px; line-height:1;
  display:flex; align-items:center; justify-content:center; color:#fff; background:var(--orange);
  box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 14px 26px rgba(0,0,0,.18); cursor:pointer; touch-action:manipulation;
  transition: transform .12s, box-shadow .12s; padding:0; font-family:inherit; }
.btn:active{ transform: scale(.92) translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.18); animation:none; }
.btn.small{ min-width:80px; min-height:80px; width:80px; height:80px; font-size:36px; background:#fff; color:var(--ink);
  box-shadow: 0 5px 0 rgba(0,0,0,.14), 0 8px 16px rgba(0,0,0,.14); }

#mute{ position:absolute; top: calc(var(--sat) + 12px); right: calc(var(--sar) + 12px); z-index:30; }

/* ---------- HOME ---------- */
#home{ justify-content:space-evenly; z-index:10; overflow-y:auto; gap:4px; }
#home-top{ width:100%; display:flex; align-items:center; justify-content:flex-start; min-height:80px; padding-right:92px; margin-top:-4px; }
#home-mascot{ font-size:64px; line-height:1; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
h1{ font-size: clamp(26px, 7.6vw, 38px); margin:0 0 0 10px; font-weight:900; color:#fff; letter-spacing:.5px; line-height:1.05;
  text-shadow: 0 3px 0 #1f78c8, 0 6px 14px rgba(0,0,0,.25); }
#book{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; width:100%; max-width:420px;
  background:rgba(255,255,255,.55); border-radius:30px; padding:10px; box-shadow: 0 6px 0 rgba(0,0,0,.08), inset 0 0 0 4px rgba(255,255,255,.7); margin:8px 0; }
.slot{ aspect-ratio:1/1; min-height:64px; border-radius:24px; background:#fff; display:flex; align-items:center; justify-content:center;
  font-size: clamp(34px, 10vw, 52px); line-height:1; box-shadow: 0 5px 0 rgba(0,0,0,.1); cursor:pointer; touch-action:manipulation; position:relative; }
.slot.locked{ background:rgba(255,255,255,.35); box-shadow:none; }
.slot.locked span{ filter: grayscale(1) brightness(1.3); opacity:.28; }
.slot.unlocked{ background:linear-gradient(#fff, #ffe9a8); animation: popIn .55s cubic-bezier(.34,1.56,.64,1); }
.slot.unlocked::after{ content:'⭐'; position:absolute; right:-4px; top:-6px; font-size:18px; }
.slot.wiggle{ animation: wiggle .5s ease-in-out; }
.slot:active{ transform:scale(.93); }
#play{ width:146px; height:146px; font-size:72px; background:var(--green); padding-left:10px; margin:4px 0 8px; position:relative; }
#play::after{ content:''; position:absolute; inset:-6px; border-radius:50%; border:6px solid rgba(255,255,255,.75); animation: halo 1.6s ease-out infinite; pointer-events:none; }
#play.free{ background:var(--pink); }

/* ---------- HUD ---------- */
#hud{ pointer-events:none; z-index:5; justify-content:flex-start; }
#hud .btn{ pointer-events:auto; }
.hud-row{ width:100%; display:flex; align-items:center; gap:10px; padding-right:92px; }
#bar{ flex:1; height:38px; background:rgba(255,255,255,.65); border-radius:22px; border:4px solid #fff; position:relative; overflow:hidden;
  box-shadow: 0 4px 0 rgba(0,0,0,.1); }
#bar-fill{ height:100%; width:0%; border-radius:20px; background:linear-gradient(90deg,#ffd23f,#ff8a1f); transition: width .4s cubic-bezier(.34,1.56,.64,1); }
#bar-stars{ position:absolute; inset:0; display:flex; justify-content:space-around; align-items:center; font-size:20px; }
#bar-stars span{ opacity:.28; transform:scale(.75); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s; filter:grayscale(1); }
#bar-stars span.lit{ opacity:1; transform:scale(1.2); filter:none; }
#guide{ width:100%; max-width:470px; display:flex; align-items:center; gap:6px; margin-top:12px; transition: opacity .3s; }
#hud.celebrating #guide{ opacity:0; }
#guide-face{ font-size:66px; line-height:1; transform-origin:50% 100%; filter: drop-shadow(0 6px 6px rgba(0,0,0,.2)); animation: bob 2.6s ease-in-out infinite; }
#guide-face.talk{ animation: talk .45s ease-in-out 3; }
#guide-face.oops{ animation: wiggle .5s ease-in-out; }
#speech{ flex:1; background:#fff; border-radius:28px; min-height:80px; padding:8px 14px; display:flex; align-items:center; justify-content:center; gap:12px;
  box-shadow: 0 6px 0 rgba(0,0,0,.12); position:relative; }
#speech::before{ content:''; position:absolute; left:-16px; top:50%; margin-top:-11px; border:11px solid transparent; border-right-color:#fff; }
#speech .hand{ font-size:46px; line-height:1; animation: point 1.1s ease-in-out infinite; }
.gb.big{ width:76px; height:76px; font-size:46px; }
.gb.big::after{ left:14px; top:11px; width:18px; height:11px; }
.gb{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:38px; line-height:1;
  box-shadow: inset -7px -9px 14px rgba(0,0,0,.18), inset 7px 7px 12px rgba(255,255,255,.55), 0 3px 0 rgba(0,0,0,.1); position:relative; }
.gb::after{ content:''; position:absolute; left:12px; top:9px; width:14px; height:9px; border-radius:50%; background:rgba(255,255,255,.85); transform:rotate(-30deg); }
.gb.rainbow{ background: conic-gradient(#ff3b5c,#ffcc1a,#2fd15f,#2f7cff,#9b4dff,#ff3b5c); }
#speech.pop{ animation: popIn .5s cubic-bezier(.34,1.56,.64,1); }

/* ---------- CELEBRATE ---------- */
#celebrate{ justify-content:center; pointer-events:none; z-index:8; }
.card{ pointer-events:auto; background:rgba(255,255,255,.94); border-radius:40px; padding:22px 26px 24px; display:flex; flex-direction:column; align-items:center; gap:10px;
  box-shadow: 0 12px 0 rgba(0,0,0,.12), 0 20px 40px rgba(0,0,0,.2); animation: cardIn .6s cubic-bezier(.34,1.56,.64,1); max-width:94%; }
.big-sticker{ font-size:118px; line-height:1.1; animation: jump 1s ease-in-out infinite; filter: drop-shadow(0 8px 8px rgba(0,0,0,.2)); }
.stars{ font-size:34px; letter-spacing:4px; animation: bob 1.4s ease-in-out infinite; }
#celebrate-book{ display:none; grid-template-columns: repeat(5, 1fr); gap:8px; font-size:40px; line-height:1.2; margin-top:10px; }
#celebrate-book.on{ display:grid; }
#celebrate-book span{ animation: jump 1.2s ease-in-out infinite; }
#next{ width:118px; height:118px; font-size:60px; background:var(--green); }

@keyframes talk{ 0%,100%{ transform:translateY(0) scale(1) } 35%{ transform:translateY(-16px) scale(1.1,.9) } 70%{ transform:translateY(0) scale(.94,1.08) } }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
@keyframes halo{ 0%{ transform:scale(.95); opacity:.9 } 100%{ transform:scale(1.28); opacity:0 } }
@keyframes popIn{ 0%{ transform:scale(0) } 70%{ transform:scale(1.18) } 100%{ transform:scale(1) } }
@keyframes jump{ 0%,100%{ transform:translateY(0) rotate(-5deg) } 50%{ transform:translateY(-16px) rotate(5deg) } }
@keyframes wiggle{ 0%,100%{ transform:rotate(0) } 25%{ transform:rotate(-14deg) } 75%{ transform:rotate(14deg) } }
@keyframes cardIn{ 0%{ transform:scale(.2); opacity:0 } 100%{ transform:scale(1); opacity:1 } }
@keyframes point{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(6px,-6px) } }
/* narrow phones: keep sticker slots at 80px+ */
@media (max-width:379px){
  .screen{ padding-left: calc(var(--sal) + 6px); padding-right: calc(var(--sar) + 6px); }
  #book{ padding:4px; gap:4px; border-radius:22px; }
  .slot{ border-radius:18px; }
}
/* landscape: book and play side by side so nothing needs scrolling */
@media (max-height:460px){
  #home{ flex-direction:row; justify-content:center; align-items:center; gap:18px; }
  #home-top{ display:none; }
  #book{ width:auto; max-width:none; grid-template-columns: repeat(5, 1fr); gap:6px; padding:8px; margin:0; }
  .slot{ width:58px; min-height:58px; font-size:34px; border-radius:16px; }
  #play{ width:112px; height:112px; font-size:56px; margin:0; }
  #guide{ margin-top:6px; } #speech{ min-height:64px; } #guide-face{ font-size:50px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <section id="home" class="screen on" aria-label="Home">
    <div id="home-top"><div id="home-mascot">🦉</div><h1>Bubble Pop Safari</h1></div>
    <div id="book" aria-label="Sticker book"></div>
    <button id="play" class="btn" data-testid="play" aria-label="Play">▶</button>
  </section>

  <section id="hud" class="screen" aria-label="Play">
    <div class="hud-row">
      <button id="home-btn" class="btn small" data-testid="home" aria-label="Home">🏠</button>
      <div id="bar"><div id="bar-fill"></div><div id="bar-stars"></div></div>
    </div>
    <div id="guide"><div id="guide-face">🦉</div><div id="speech"></div></div>
  </section>

  <section id="celebrate" class="screen" aria-label="Celebration">
    <div class="card">
      <div id="celebrate-sticker" class="big-sticker">🦁</div>
      <div id="celebrate-book"></div>
      <div class="stars">⭐⭐⭐</div>
      <button id="next" class="btn" data-testid="next" aria-label="Next">➡️</button>
    </div>
  </section>

  <button id="mute" class="btn small" data-testid="mute" aria-label="Sound on" aria-pressed="false">🔊</button>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'bps.v1';
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const COLORS = {
  red:    ['#ff3b5c','#ffc0cb','#b8143a'],
  blue:   ['#2f7cff','#bcd6ff','#1b4fc2'],
  green:  ['#2fd15f','#c0f5cf','#178f3d'],
  yellow: ['#ffcc1a','#fff2b3','#c99400'],
  purple: ['#9b4dff','#dfc9ff','#6a22c9'],
  orange: ['#ff8a1f','#ffd9b3','#c45f00'],
  pink:   ['#ff5fc8','#ffcdea','#c22a8e']
};
const ANIMALS = { lion:'🦁', monkey:'🐵', elephant:'🐘', panda:'🐼', tiger:'🐯', frog:'🐸', koala:'🐨', zebra:'🦓', giraffe:'🦒', hippo:'🦛' };
const STICKERS = ['lion','monkey','elephant','panda','tiger','frog','koala','zebra','giraffe','hippo'];
const ROUNDS = [
  { color:'red',    count:3, max:5,  speed:1.00, colors:['red','blue','yellow'],            animals:['lion','monkey','frog'] },
  { animal:'lion',  count:3, max:6,  speed:1.05, colors:['red','blue','green','yellow'],    animals:['lion','monkey','elephant'] },
  { color:'blue',   count:4, max:7,  speed:1.10, colors:['blue','green','purple','orange'], animals:['lion','monkey','elephant','panda'] },
  { animal:'monkey',count:4, max:8,  speed:1.15, colors:['red','blue','green','yellow'],    animals:['monkey','tiger','frog','panda'] },
  { color:'green',  count:5, max:9,  speed:1.20, colors:['green','pink','yellow','blue','orange'], animals:['tiger','frog','koala','lion'] },
  { animal:'elephant', count:5, max:10, speed:1.30, colors:['red','blue','green','purple','orange'], animals:['elephant','hippo','panda','monkey'] },
  { color:'yellow', count:5, max:11, speed:1.35, colors:['yellow','orange','pink','purple','blue'], animals:['koala','zebra','giraffe','frog','lion'] },
  { color:'blue', animal:'elephant', count:4, max:11, speed:1.40, colors:['blue','red','green'],       animals:['elephant','lion','panda'] },
  { color:'red',  animal:'lion',     count:5, max:12, speed:1.50, colors:['red','orange','pink','blue'], animals:['lion','tiger','monkey','frog'] },
  { color:'purple', animal:'panda',  count:6, max:13, speed:1.60, colors:['purple','pink','blue','green'], animals:['panda','koala','zebra','elephant'] }
];
const FREE = { free:true, count:10, max:10, speed:1.3, colors:Object.keys(COLORS), animals:Object.keys(ANIMALS) };
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };

/* ---------- persistence ---------- */
let unlocked = [], muted = false;
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'{}'); if(Array.isArray(d.unlocked)) unlocked=d.unlocked.filter(n=>Number.isInteger(n)&&n>=1&&n<=10); muted=!!d.muted; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({unlocked, muted})); }catch(e){} }
load();

/* ---------- audio (Web Audio, generated) ---------- */
let ac=null, master=null;
function audio(){
  if(!ac){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ ac=new AC(); master=ac.createGain(); master.gain.value=0.8; master.connect(ac.destination); } }catch(e){ ac=null; } }
  if(ac && ac.state!=='running'){ try{ ac.resume().catch(()=>{}); }catch(e){} }  // also covers Safari's 'interrupted'
  return ac;
}
function tone(o){
  if(muted) return; const a=audio(); if(!a) return;
  try{
    const t=a.currentTime+(o.delay||0), dur=o.dur||0.15;
    const osc=a.createOscillator(), g=a.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.freq,t);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
    if(o.wob){ const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=o.wob; lg.gain.value=o.wobDepth||25; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+dur+0.05); }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.vol||0.2,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t+dur+0.05);
  }catch(e){}
}
const sfx = {
  pop(k){ const f=470*Math.pow(2,k*0.95);
    tone({freq:f, slide:f*1.7, type:'sine', dur:0.17, vol:0.3});
    tone({freq:f*2, slide:f*2.6, type:'triangle', dur:0.11, vol:0.1, delay:0.01});
    tone({freq:f*0.5, type:'square', dur:0.035, vol:0.05}); },
  wrong(){ tone({freq:520, slide:400, type:'triangle', dur:0.13, vol:0.16, wob:14, wobDepth:35});
    tone({freq:440, slide:340, type:'triangle', dur:0.13, vol:0.14, delay:0.12, wob:14, wobDepth:35});
    tone({freq:370, slide:280, type:'triangle', dur:0.18, vol:0.12, delay:0.24, wob:14, wobDepth:35}); },
  tick(){ tone({freq:900, slide:1200, type:'sine', dur:0.06, vol:0.1}); },
  sparkle(){ tone({freq:1500, slide:2200, type:'sine', dur:0.09, vol:0.07}); },
  fanfare(){ const n=[523,659,784,1047,1319]; n.forEach((f,i)=>tone({freq:f, type:'triangle', dur:0.26, vol:0.2, delay:i*0.11}));
    [523,659,784,1047].forEach(f=>tone({freq:f, type:'sine', dur:0.9, vol:0.12, delay:0.6}));
    [1047,1319,1568].forEach((f,i)=>tone({freq:f, slide:f*1.02, type:'sine', dur:0.5, vol:0.08, delay:0.9+i*0.08})); },
  party(){ sfx.fanfare(); [1568,1760,2093].forEach((f,i)=>tone({freq:f, type:'triangle', dur:0.4, vol:0.1, delay:1.3+i*0.12})); }
};

/* ---------- speech ---------- */
let speechTries=0;
function say(text, soft){
  if(muted){ guideTalk(); return; }
  try{
    const s=window.speechSynthesis; if(!s){ guideTalk(); return; }
    if(soft && (s.speaking||s.pending)) return;   // do not interrupt the instruction
    guideTalk();
    s.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=0.95; u.pitch=1.2; u.lang='en-US';
    setTimeout(()=>{ try{ s.speak(u); }catch(e){} }, 40);
  }catch(e){}
}
function unlockMedia(){
  audio();
  if(speechTries<3){ speechTries++; try{ const s=window.speechSynthesis; if(s){ s.speak(new SpeechSynthesisUtterance('')); } }catch(e){} }
}
// pointerdown for Chrome/Android; touchend + click as fallbacks for WebKit user-activation rules
document.addEventListener('pointerdown', unlockMedia, {passive:true});
document.addEventListener('touchend', unlockMedia, {passive:true});
document.addEventListener('click', unlockMedia, {passive:true});

/* ---------- canvas ---------- */
const app=$('#app'), canvas=$('#c'), ctx=canvas.getContext('2d',{alpha:false});
let W=1,H=1,dpr=1,gen=0,hudB=0;
const sprites=new Map(), grads=new Map();
let sky=null;
function resize(){
  const r=app.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  const nd=Math.min(window.devicePixelRatio||1,2);
  if(nd!==dpr){ dpr=nd; sprites.clear(); }
  grads.clear(); gen++;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#6fd6ff'); sky.addColorStop(0.6,'#bdeeff'); sky.addColorStop(1,'#c6f5bd');
  for(let i=0;i<bubbles.length;i++){ const b=bubbles[i], m=b.r+b.amp+6; b.x0=clamp(b.x0,m,Math.max(m,W-m)); }
  if(screen==='play') measureHud();
}
function measureHud(){ try{ hudB=Math.round($('#guide').getBoundingClientRect().bottom)||0; }catch(e){ hudB=0; } }
window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,60));
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function sprite(ch,size){
  const key=ch+'|'+size; let s=sprites.get(key); if(s) return s;
  const px=Math.round(size*dpr); const c=document.createElement('canvas'); c.width=c.height=Math.ceil(px*1.4);
  const x=c.getContext('2d'); x.font=px+'px '+EMOJI_FONT; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(ch,c.width/2,c.height/2+px*0.05);
  s={c, css:c.width/dpr}; sprites.set(key,s); return s;
}
function drawSprite(s,x,y,scale,alpha){
  const w=s.css*(scale||1);
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.drawImage(s.c, x-w/2, y-w/2, w, w);
  ctx.globalAlpha=1;
}
function bubbleGrad(color,r){
  const key=color+'|'+r; let g=grads.get(key); if(g) return g;
  const [main,light,dark]=COLORS[color];
  g=ctx.createRadialGradient(-r*0.35,-r*0.38,r*0.08,0,0,r); g.addColorStop(0,light); g.addColorStop(0.5,main); g.addColorStop(1,dark);
  grads.set(key,g); return g;
}
function starPath(x,y,R,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=rot-Math.PI/2+i*Math.PI/5, rad=i%2?r:R; ctx.lineTo(x+Math.cos(a)*rad, y+Math.sin(a)*rad); }
  ctx.closePath();
}

/* ---------- game state ---------- */
let screen='home', round=1, progress=0, goal=3, cur=ROUNDS[0];
let bubbles=[], fx=[], confetti=[], uid=0, spawnT=0, t=0, nextIn=0, doneIn=0, celebrateAt=0, resume=null;
function nextUnfinished(){ for(let i=1;i<=10;i++) if(!unlocked.includes(i)) return i; return 0; }
function matches(color,animal){ return (!cur.color||cur.color===color) && (!cur.animal||cur.animal===animal); }
function bubbleRadius(){ return Math.round(clamp(W*0.125,42,54) - (cur.free?4:(round-1)*0.8)); }

function spawnBubble(forceTarget, y0){
  const r=bubbleRadius();
  let color, animal, isTarget;
  if(cur.free){ color=pick(cur.colors); animal=pick(cur.animals); isTarget=true; }
  else{
    const nonT=bubbles.filter(b=>!b.isTarget).length;
    const wantT=forceTarget || (nonT>=2 && Math.random()<0.45);
    if(wantT){ color=cur.color||pick(cur.colors); animal=cur.animal||pick(cur.animals); }
    else{ let g=0; do{ color=pick(cur.colors); animal=pick(cur.animals); }while(matches(color,animal) && ++g<30); }
    isTarget=matches(color,animal);
  }
  const y = (y0!=null) ? y0 : H+r+8;
  const amp=10+Math.random()*18; let x0=W/2;
  for(let k=0;k<8;k++){
    const m=r+amp+6; x0=m+Math.random()*Math.max(1,W-2*m);
    if(!bubbles.some(b=>Math.abs(b.y-y)<b.r+r && Math.abs(b.x0-x0)<b.r+r-8)) break;
  }
  bubbles.push({ id:++uid, x0, x:x0, y, r, vy:-(38+Math.random()*30)*cur.speed, amp, freq:0.8+Math.random()*1.2, phase:Math.random()*6.283,
    color, animal, isTarget, age:0, wig:0, alpha:1 });
}
function spawnAmbient(){
  const r=44; const amp=12+Math.random()*16, m=r+amp+6, x0=m+Math.random()*Math.max(1,W-2*m);
  bubbles.push({ id:++uid, x0, x:x0, y:H+r+8, r, vy:-(22+Math.random()*18), amp, freq:0.6+Math.random(), phase:Math.random()*6.283,
    color:pick(Object.keys(COLORS)), animal:pick(Object.keys(ANIMALS)), isTarget:false, age:0, wig:0, alpha:0.6 });
}

/* ---------- effects ---------- */
function addPop(b){
  const main=COLORS[b.color][0];
  fx.push({type:'ring', x:b.x, y:b.y, r:b.r, life:0.45, max:0.45, color:main});
  fx.push({type:'flash', x:b.x, y:b.y, r:b.r, life:0.4, max:0.4, rot:Math.random()*6.28});
  const parts=[]; for(let i=0;i<12;i++){ const a=Math.random()*6.283, sp=200+Math.random()*240;
    parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,rot:Math.random()*6.28,vr:(Math.random()-.5)*14,size:8+Math.random()*11,color:pick(['#fff','#ffe066','#ffb020','#ff5fc8','#7ce0ff','#fff'])}); }
  fx.push({type:'stars', parts, life:0.9, max:0.9});
  const drops=[]; for(let i=0;i<8;i++){ const a=Math.random()*6.283, sp=120+Math.random()*160; drops.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,size:4+Math.random()*6}); }
  fx.push({type:'drops', parts:drops, color:main, life:0.6, max:0.6});
  fx.push({type:'animal', x:b.x, y:b.y, emoji:ANIMALS[b.animal], size:b.r*1.3, life:1.05, max:1.05});
}
function addSparkle(x,y){
  const parts=[]; for(let i=0;i<5;i++){ const a=Math.random()*6.283, sp=80+Math.random()*120;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,rot:0,vr:(Math.random()-.5)*10,size:5+Math.random()*5,color:pick(['#fff','#ffe066','#7ce0ff'])}); }
  fx.push({type:'stars', parts, life:0.5, max:0.5});
}
const CONF=['#ff3b5c','#ffcc1a','#2fd15f','#2f7cff','#9b4dff','#ff8a1f','#ff5fc8','#ffffff'];
function confettiBurst(big){
  if(confetti.length>300) return;   // bound stacked bursts
  const n=big?170:90;
  for(let i=0;i<n;i++) confetti.push({ x:Math.random()*W, y:-20-Math.random()*H*0.35, vx:(Math.random()-.5)*140, vy:90+Math.random()*180,
    w:7+Math.random()*9, h:5+Math.random()*7, rot:Math.random()*6.28, vr:(Math.random()-.5)*12, color:pick(CONF), shape:Math.random()<0.25?1:0, life:3.4+Math.random()*1.2, wob:Math.random()*6.28 });
  const m=big?90:40;
  for(let i=0;i<m;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.6, sp=350+Math.random()*420;
    confetti.push({ x:W/2, y:H*0.55, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, w:7+Math.random()*9, h:5+Math.random()*7, rot:Math.random()*6.28, vr:(Math.random()-.5)*14, color:pick(CONF), shape:Math.random()<0.3?2:0, life:3.2+Math.random(), wob:Math.random()*6.28 }); }
}

/* ---------- UI ---------- */
const els={ home:$('#home'), hud:$('#hud'), celebrate:$('#celebrate'), speech:$('#speech'), face:$('#guide-face'), fill:$('#bar-fill'), stars:$('#bar-stars'),
  book:$('#book'), play:$('#play'), mute:$('#mute'), csticker:$('#celebrate-sticker'), cbook:$('#celebrate-book') };
function showScreens(list){ ['home','hud','celebrate'].forEach(k=>els[k].classList.toggle('on', list.includes(k))); els.hud.classList.toggle('celebrating', list.includes('celebrate')); }
let talkT=0;
function guideTalk(){ const f=els.face; f.classList.remove('talk','oops'); void f.offsetWidth; f.classList.add('talk'); clearTimeout(talkT); talkT=setTimeout(()=>f.classList.remove('talk'),1400); }
function guideOops(){ const f=els.face; f.classList.remove('talk','oops'); void f.offsetWidth; f.classList.add('oops'); clearTimeout(talkT); talkT=setTimeout(()=>f.classList.remove('oops'),600); }
function renderGoal(){
  let html='';
  // icons only: pointing hand + the bubble to pop; the star bar shows how many
  if(cur.free){ html='<span class="hand">👆</span><span class="gb big rainbow">✨</span>'; }
  else{
    const style = cur.color ? ' style="background:'+COLORS[cur.color][0]+'"' : '';
    html='<span class="hand">👆</span><span class="gb big'+(cur.color?'':' rainbow')+'"'+style+'>'+(cur.animal?ANIMALS[cur.animal]:'')+'</span>';
  }
  els.speech.innerHTML=html; els.speech.classList.remove('pop'); void els.speech.offsetWidth; els.speech.classList.add('pop');
}
function updateBar(){
  els.fill.style.width=(goal?Math.min(1,progress/goal)*100:0)+'%';
  if(els.stars.children.length!==goal){ els.stars.innerHTML=''; for(let i=0;i<goal;i++){ const s=document.createElement('span'); s.textContent='⭐'; els.stars.appendChild(s); } els.stars.style.fontSize=goal>6?'15px':'20px'; }
  [...els.stars.children].forEach((s,i)=>s.classList.toggle('lit', i<progress));
}
function renderBook(){
  els.book.innerHTML='';
  for(let i=1;i<=10;i++){
    const d=document.createElement('div'); const un=unlocked.includes(i);
    d.className='slot '+(un?'unlocked':'locked'); d.dataset.round=i; d.dataset.testid='sticker-'+i; d.setAttribute('role','button');
    d.setAttribute('aria-label', un ? 'Replay round '+i : 'Locked sticker '+i);
    d.innerHTML='<span>'+ANIMALS[STICKERS[i-1]]+'</span>';
    d.addEventListener('pointerdown', e=>{ e.preventDefault(); if(un){ sfx.tick(); startPlay(i); } else { d.classList.remove('wiggle'); void d.offsetWidth; d.classList.add('wiggle'); sfx.wrong(); } });
    els.book.appendChild(d);
  }
  els.play.classList.toggle('free', nextUnfinished()===0);
}
function renderMute(){ els.mute.textContent=muted?'🔇':'🔊'; els.mute.setAttribute('aria-label', muted?'Sound off':'Sound on'); els.mute.setAttribute('aria-pressed', String(muted)); }
function toggleMute(){ muted=!muted; save(); renderMute(); if(muted){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} } else { sfx.tick(); } }

/* ---------- flow ---------- */
function goalPhrase(){
  if(cur.free) return 'Free play! Pop them all!';
  const n=NUM[goal]||String(goal);
  if(cur.color&&cur.animal) return 'Pop '+n+' '+cur.color+' '+cur.animal+'s!';
  if(cur.color) return 'Pop '+n+' '+cur.color+' bubbles!';
  return 'Pop '+n+' '+cur.animal+'s!';
}
function beginPlay(p0){
  nextIn=0; doneIn=0; resume=null;
  progress=p0||0; goal=cur.count; bubbles=[]; fx=[]; spawnT=0.3; screen='play';
  showScreens(['hud']); renderGoal(); updateBar(); measureHud();
  const n=Math.min(cur.max,4); for(let i=0;i<n;i++) spawnBubble(i<2, H*0.5+i*H*0.14);
  say(goalPhrase());
}
function startPlay(n,p0){ round=n; cur=ROUNDS[n-1]; beginPlay(p0); }
function startFree(){ round=11; cur=FREE; beginPlay(); }
function startGame(){
  if(resume && !unlocked.includes(resume.round)){ startPlay(resume.round, resume.progress); return; }  // accidental Home tap costs nothing
  const n=nextUnfinished(); if(n) startPlay(n); else startFree();
}
function goHome(party){
  if(screen==='play' && !cur.free && progress>0 && progress<goal) resume={round, progress};
  nextIn=0; doneIn=0;
  screen='home'; bubbles=[]; fx=[]; spawnT=0; showScreens(['home']); renderBook();
  if(party){ confettiBurst(true); sfx.party(); say('You collected every sticker! You are a safari star!'); }
}
function unlockNow(){ if(!cur.free && !unlocked.includes(round)){ unlocked.push(round); save(); } }
function completeRound(){
  if(screen!=='play') return;
  screen='celebrate'; celebrateAt=t;
  const final = !cur.free && round===10;
  unlockNow();
  els.csticker.textContent = final ? '🏆' : ANIMALS[STICKERS[round-1]];
  els.cbook.classList.toggle('on', final);
  if(final){ els.cbook.innerHTML=STICKERS.map(a=>'<span>'+ANIMALS[a]+'</span>').join(''); }
  showScreens(['hud','celebrate']);
  confettiBurst(true); if(final) sfx.party(); else sfx.fanfare();
  say(final ? 'You got all the stickers! Hooray!' : pick(['Hooray! You did it!','Amazing!','Super pop!','Yay! A new sticker!']));
  nextIn = final?7:5.5;   // counted down in update(), so a hidden tab pauses it
}
function nextRound(){ nextIn=0; if(screen!=='celebrate') return; if(round>=10) goHome(true); else startPlay(round+1); }
function freeFill(){ confettiBurst(false); sfx.fanfare(); say(pick(['Wow!','Super!','Pop pop pop!'])); progress=0; updateBar(); }

/* ---------- input ---------- */
function onTap(x,y){
  if(screen!=='play') return;
  let best=null, bd=1e9;
  for(const b of bubbles){ if(b.y>H+b.r*0.5) continue; const d=Math.hypot(b.x-x,b.y-y); if(d<=b.r+12 && d<bd){ bd=d; best=b; } }
  if(!best){ addSparkle(x,y); sfx.sparkle(); return; }
  if(best.isTarget){
    bubbles.splice(bubbles.indexOf(best),1); addPop(best);
    if(progress<goal){
      progress++; updateBar(); sfx.pop(progress/goal);
      if(progress>=goal){ if(cur.free) freeFill(); else { unlockNow(); doneIn=0.65; } }   // sticker is safe the moment the bar fills
      else say(NUM[progress]||String(progress), true);
    } else sfx.pop(1);
  } else {
    best.wig=0.7; sfx.wrong(); guideOops();
  }
}
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(e.clientX, e.clientY); });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
els.play.addEventListener('pointerdown', e=>{ e.preventDefault(); sfx.tick(); startGame(); });
$('#home-btn').addEventListener('pointerdown', e=>{ e.preventDefault(); sfx.tick(); goHome(false); });
$('#next').addEventListener('pointerdown', e=>{ e.preventDefault(); if(t-celebrateAt<0.7) return; sfx.tick(); nextRound(); });   // a mashing kid cannot skip the sticker moment
els.mute.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleMute(); });

/* ---------- loop ---------- */
function update(dt){
  t+=dt;
  if(doneIn>0){ doneIn-=dt; if(doneIn<=0){ doneIn=0; completeRound(); } }
  if(nextIn>0){ nextIn-=dt; if(nextIn<=0){ nextIn=0; nextRound(); } }
  const playing = screen==='play';
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.age+=dt; b.y+=b.vy*dt; b.x=b.x0+Math.sin(t*b.freq+b.phase)*b.amp; if(b.wig>0) b.wig-=dt;
    if(b.y < (playing ? hudB-b.r : -b.r*1.6)) bubbles.splice(i,1); }   // gone once fully under the guide pill
  spawnT-=dt;
  if(playing && progress<goal){
    let targets=0; for(let i=0;i<bubbles.length;i++){ const b=bubbles[i]; if(b.isTarget && b.y>hudB && b.y<H+b.r*0.5) targets++; }   // only ones a child can see
    const need=targets<2;
    if((need && bubbles.length<cur.max+2) || (spawnT<=0 && bubbles.length<cur.max)){ spawnBubble(need); spawnT=(0.55+Math.random()*0.5)/cur.speed; }
  } else if(screen==='home'){
    if(spawnT<=0 && bubbles.length<6){ spawnAmbient(); spawnT=1.1; }
  }
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life-=dt; if(f.life<=0){ fx.splice(i,1); continue; }
    if(f.parts){ const gr=f.type==='stars'?520:700; for(const p of f.parts){ p.vy+=gr*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.vr!==undefined) p.rot+=p.vr*dt; } } }
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i]; c.life-=dt; if(c.life<=0||c.y>H+30){ confetti.splice(i,1); continue; }
    c.vy+=260*dt; c.vy*=0.985; c.vx*=0.985; c.wob+=dt*4; c.x+=(c.vx+Math.sin(c.wob)*40)*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; }
}
function drawBubble(b){
  if(b.gen!==gen){ b.gen=gen; b.spr=sprite(ANIMALS[b.animal],Math.round(b.r*1.15)); b.grad=bubbleGrad(b.color,b.r); }
  let a=b.alpha; if(screen==='play' && hudB>0 && b.y<hudB+b.r) a*=clamp((b.y-(hudB-b.r))/(2*b.r),0,1);   // fade under the HUD
  let s=b.age<0.4?easeOutBack(b.age/0.4):1;
  const sq=Math.sin(t*2.6+b.phase)*0.045;
  let sx=s*(1+sq), sy=s*(1-sq), dx=0;
  if(b.wig>0){ const w=b.wig, k=Math.sin(w*34)*w; dx=k*16; sx*=1+0.2*k; sy*=1-0.2*k; }
  ctx.save(); ctx.translate(b.x+dx,b.y); ctx.scale(sx,sy);
  if(a<1) ctx.globalAlpha=a;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,6.2832); ctx.fillStyle=b.grad; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-b.r*0.42,-b.r*0.46,b.r*0.2,b.r*0.11,-0.6,0,6.2832); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
  drawSprite(b.spr,0,b.r*0.05,1,a);
  ctx.restore();
}
function drawFx(f){
  const p=1-f.life/f.max;
  if(f.type==='ring'){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1+p*1.7),0,6.2832); ctx.strokeStyle=f.color; ctx.globalAlpha=1-p; ctx.lineWidth=2+7*(1-p); ctx.stroke(); ctx.globalAlpha=1; }
  else if(f.type==='flash'){ ctx.globalAlpha=(1-p)*0.9; ctx.fillStyle='#fff7b0'; starPath(f.x,f.y,f.r*(0.9+p*1.6),f.r*(0.4+p*0.6),f.rot+p*1.2); ctx.fill(); ctx.globalAlpha=1; }
  else if(f.type==='stars'){ ctx.globalAlpha=Math.min(1,f.life/0.3); for(const q of f.parts){ ctx.fillStyle=q.color; starPath(q.x,q.y,q.size,q.size*0.45,q.rot); ctx.fill(); } ctx.globalAlpha=1; }
  else if(f.type==='drops'){ ctx.globalAlpha=1-p; ctx.fillStyle=f.color; for(const q of f.parts){ ctx.beginPath(); ctx.arc(q.x,q.y,q.size*(1-p*0.5),0,6.2832); ctx.fill(); } ctx.globalAlpha=1; }
  else if(f.type==='animal'){ const yOff=-Math.sin(Math.min(1,p*1.2)*Math.PI)*80-p*40; const sc=1+0.7*Math.sin(Math.min(1,p*1.6)*Math.PI/2); const a=p<0.65?1:1-(p-0.65)/0.35;
    if(f.gen!==gen){ f.gen=gen; f.spr=sprite(f.emoji,Math.round(f.size)); }
    ctx.save(); ctx.translate(f.x,f.y+yOff); ctx.rotate(Math.sin(p*12)*0.15*(1-p)); drawSprite(f.spr,0,0,sc,a); ctx.restore(); }
}
function draw(){
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // sun + hills
  ctx.fillStyle='rgba(255,236,120,.35)'; ctx.beginPath(); ctx.arc(W-30,H*0.13,86,0,6.2832); ctx.fill();
  ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(W-30,H*0.13,58,0,6.2832); ctx.fill();
  ctx.fillStyle='#9ee87f'; ctx.beginPath(); ctx.ellipse(W*0.25,H+30,W*0.55,80,0,0,6.2832); ctx.fill();
  ctx.fillStyle='#7fd96a'; ctx.beginPath(); ctx.ellipse(W*0.85,H+40,W*0.5,70,0,0,6.2832); ctx.fill();
  for(let i=0;i<bubbles.length;i++) drawBubble(bubbles[i]);
  for(let i=0;i<fx.length;i++) drawFx(fx[i]);
  for(let i=0;i<confetti.length;i++){ const c=confetti[i], cs=Math.cos(c.rot), sn=Math.sin(c.rot);
    ctx.setTransform(dpr*cs,dpr*sn,-dpr*sn,dpr*cs,c.x*dpr,c.y*dpr);   // one transform per piece, no save/restore
    ctx.fillStyle=c.color; ctx.globalAlpha=Math.min(1,c.life);
    if(c.shape===1){ ctx.beginPath(); ctx.arc(0,0,c.w*0.45,0,6.2832); ctx.fill(); } else if(c.shape===2){ starPath(0,0,c.w*0.8,c.w*0.35,0); ctx.fill(); } else ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.wob))); }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1;
}
let last=performance.now();
let frameErr=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden){ try{ update(dt); draw(); }catch(e){ if(!frameErr){ frameErr=true; console.error('Bubble Pop frame error', e); } } }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', ()=>{
  last=performance.now();
  if(document.hidden){   // phone in a pocket: go quiet, timers are dt-based so they wait too
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    try{ if(ac && ac.state==='running') ac.suspend().catch(()=>{}); }catch(e){}
  }
});
window.addEventListener('pageshow', ()=>{ last=performance.now(); });
requestAnimationFrame(frame);

/* ---------- init ---------- */
resize();
round=nextUnfinished()||1; cur=ROUNDS[round-1]; goal=cur.count;
renderBook(); renderMute(); showScreens(['home']);

/* ---------- PWA ---------- */
try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); } }catch(e){}

/* ---------- tiny test hook ---------- */
window.__bps = {
  state(){ return {
    screen, round, progress, goal,
    target: Object.assign({}, cur.color?{color:cur.color}:{}, cur.animal?{animal:cur.animal}:{}, {count:goal}),
    unlocked: unlocked.slice().sort((a,b)=>a-b), muted,
    bubbles: screen==='play' ? bubbles.filter(b=>b.y>hudB&&b.y<=H&&b.x>=0&&b.x<=W).map(b=>({id:b.id, x:Math.round(b.x*10)/10, y:Math.round(b.y*10)/10, r:b.r, color:b.color, animal:b.animal, isTarget:b.isTarget})) : []
  }; },
  startGame(){ if(screen==='home') startGame(); },
  resetProgress(){ unlocked=[]; resume=null; if(screen==='home'){ round=1; cur=ROUNDS[0]; goal=cur.count; progress=0; } save(); renderBook(); }
};
})();
</script>
</body>
