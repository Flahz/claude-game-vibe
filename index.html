<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubble Pop">
<meta name="theme-color" content="#ff7a1f">
<meta name="format-detection" content="telephone=no">
<title>Bubble Pop Safari</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --orange:#ff7a1f; --green:#2fd15f; --pink:#ff4fa3; --ink:#2b2b45;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#6fd6ff; touch-action:manipulation; }
body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; position:fixed; inset:0; color:var(--ink); }
#app{ position:fixed; top:0; left:0; right:0; bottom:0; inset:0; overflow:hidden; background:linear-gradient(#6fd6ff 0%, #b9efff 60%, #c6f5bd 100%); }
#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

.screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 14px) calc(var(--sal) + 12px); }
.screen.on{ display:flex; }

.btn{ border:none; border-radius:999px; min-width:88px; min-height:88px; font-size:44px; line-height:1;
  display:flex; align-items:center; justify-content:center; color:#fff; background:var(--orange);
  box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 14px 26px rgba(0,0,0,.18); cursor:pointer; touch-action:manipulation;
  transition: transform .12s, box-shadow .12s; padding:0; font-family:inherit; }
.btn:active{ transform: scale(.92) translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.18); animation:none; }
.btn.small{ min-width:80px; min-height:80px; width:80px; height:80px; font-size:36px; background:#fff; color:var(--ink);
  box-shadow: 0 5px 0 rgba(0,0,0,.14), 0 8px 16px rgba(0,0,0,.14); }

#mute{ position:absolute; top: calc(var(--sat) + 12px); right: calc(var(--sar) + 12px); z-index:30; }

/* ---------- HOME ---------- */
#home{ justify-content:space-evenly; z-index:10; overflow-y:auto; gap:4px; }
#home-top{ width:100%; display:flex; align-items:center; justify-content:flex-start; min-height:80px; padding-right:92px; margin-top:-4px; }
#home-mascot{ font-size:64px; line-height:1; display:flex; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
h1{ font-size: clamp(26px, 7.6vw, 38px); margin:0 0 0 10px; font-weight:900; color:#fff; letter-spacing:.5px; line-height:1.05;
  text-shadow: 0 3px 0 #1f78c8, 0 6px 14px rgba(0,0,0,.25); }
#book{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; width:100%; max-width:380px;
  background:rgba(255,255,255,.55); border-radius:30px; padding:10px; box-shadow: 0 6px 0 rgba(0,0,0,.08), inset 0 0 0 4px rgba(255,255,255,.7); margin:8px 0; }
.slot{ aspect-ratio:1/1; min-height:64px; border-radius:24px; background:#fff; display:flex; align-items:center; justify-content:center;
  font-size: clamp(34px, 10vw, 52px); line-height:1; box-shadow: 0 5px 0 rgba(0,0,0,.1); cursor:pointer; touch-action:manipulation; position:relative; }
.slot.locked{ background:rgba(255,255,255,.35); box-shadow:none; }
.slot.locked span{ filter: grayscale(1) brightness(1.3); opacity:.28; }
.slot.unlocked{ background:linear-gradient(#fff, #ffe9a8); }
.slot.pop{ animation: popIn .55s cubic-bezier(.34,1.56,.64,1); }   /* only the sticker just earned pops in */
.slot .badge{ position:absolute; right:-4px; top:-6px; width:22px; height:22px; display:none; transform:translateZ(0); }
.slot.unlocked .badge{ display:flex; }
.slot .badge img.art{ width:100%; height:100%; }
.slot.wiggle{ animation: wiggle .5s ease-in-out; }
.slot:active{ transform:scale(.93); }
#play{ width:132px; height:132px; font-size:72px; background:var(--green); margin:2px 0 6px; position:relative; }
#play img.art{ width:62%; height:62%; margin-left:6%; }
#play::after{ content:''; position:absolute; inset:-6px; border-radius:50%; border:6px solid rgba(255,255,255,.75); animation: halo 1.6s ease-out infinite; pointer-events:none; }
#play.free{ background:var(--pink); }

/* ---------- HUD ---------- */
#hud{ pointer-events:none; z-index:5; justify-content:flex-start; }
#hud .btn{ pointer-events:auto; }
.hud-row{ width:100%; display:flex; align-items:center; gap:10px; padding-right:92px; }
#bar{ flex:1; height:38px; background:rgba(255,255,255,.65); border-radius:22px; border:4px solid #fff; position:relative; overflow:hidden;
  box-shadow: 0 4px 0 rgba(0,0,0,.1); }
#bar-fill{ height:100%; width:0%; border-radius:20px; background:linear-gradient(90deg,#ffd23f,#ff8a1f); transition: width .4s cubic-bezier(.34,1.56,.64,1); }
#bar-stars{ position:absolute; inset:0; display:flex; justify-content:space-around; align-items:center; font-size:20px; }
#bar-stars span{ display:flex; width:1em; height:1em; opacity:.28; transform:scale(.75); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s; filter:grayscale(1); }
#bar-stars span.lit{ opacity:1; transform:scale(1.2); filter:none; }
#guide{ width:100%; max-width:470px; display:flex; align-items:center; gap:6px; margin-top:12px; transition: opacity .3s; }
#hud.celebrating #guide{ opacity:0; }
#guide-face{ font-size:66px; line-height:1; display:flex; transform-origin:50% 100%; filter: drop-shadow(0 6px 6px rgba(0,0,0,.2)); animation: bob 2.6s ease-in-out infinite; }
#guide-face.talk{ animation: talk .45s ease-in-out 3; }
#guide-face.oops{ animation: wiggle .5s ease-in-out; }
#speech{ flex:1; background:#fff; border-radius:28px; min-height:80px; padding:8px 12px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  box-shadow: 0 6px 0 rgba(0,0,0,.12); position:relative; }
#speech::before{ content:''; position:absolute; left:-16px; top:50%; margin-top:-11px; border:11px solid transparent; border-right-color:#fff; }
#speech .hand{ font-size:46px; line-height:1; display:flex; animation: point 1.1s ease-in-out infinite; }
.gb.big{ width:76px; height:76px; font-size:46px; }
.gb.big::after{ left:14px; top:11px; width:18px; height:11px; }
.gb{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:38px; line-height:1;
  box-shadow: inset -7px -9px 14px rgba(0,0,0,.18), inset 7px 7px 12px rgba(255,255,255,.55), 0 3px 0 rgba(0,0,0,.1); position:relative; }
.gb::after{ content:''; position:absolute; left:12px; top:9px; width:14px; height:9px; border-radius:50%; background:rgba(255,255,255,.85); transform:rotate(-30deg); }
.gb.rainbow{ background: conic-gradient(#ff3b5c,#ffcc1a,#2fd15f,#2f7cff,#9b4dff,#ff3b5c); }
#speech.pop{ animation: popIn .5s cubic-bezier(.34,1.56,.64,1); }
#speech .say{ font-size: clamp(18px, 5.6vw, 24px); font-weight:900; text-align:center; line-height:1.15; letter-spacing:.2px; color:var(--ink); }
#speech .say .cw{ text-shadow: 0 1px 0 rgba(255,255,255,.6); }
#speech .icons{ display:flex; align-items:center; justify-content:center; gap:12px; }
#toast{ position:absolute; left:0; right:0; top:46%; text-align:center; pointer-events:none; z-index:6; font-size: clamp(34px, 10vw, 52px); font-weight:900; color:#fff;
  text-shadow: 0 3px 0 #1f78c8, 0 0 12px rgba(0,0,0,.25), -2px -2px 0 #1f78c8, 2px -2px 0 #1f78c8, -2px 2px 0 #1f78c8, 2px 2px 0 #1f78c8; opacity:0; transform:scale(.6); }
#toast.on{ animation: toastIn .55s cubic-bezier(.34,1.56,.64,1) forwards; }
#toast.out{ animation: toastOut .3s ease-in forwards; }
.dopt{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.dl{ font-size:15px; font-weight:800; color:#fff; text-shadow: 0 2px 0 #1f78c8, 0 3px 8px rgba(0,0,0,.25); letter-spacing:.3px; }
#ctext{ font-size: clamp(22px, 6.5vw, 30px); font-weight:900; color:var(--ink); text-align:center; line-height:1.1; }
@keyframes toastIn{ 0%{ opacity:0; transform:scale(.6) } 100%{ opacity:1; transform:scale(1) } }
@keyframes toastOut{ 0%{ opacity:1; transform:scale(1) } 100%{ opacity:0; transform:scale(1.15) translateY(-20px) } }

/* ---------- CELEBRATE ---------- */
#celebrate{ justify-content:center; pointer-events:none; z-index:8; }
.card{ pointer-events:auto; background:rgba(255,255,255,.94); border-radius:40px; padding:22px 26px 24px; display:flex; flex-direction:column; align-items:center; gap:10px;
  box-shadow: 0 12px 0 rgba(0,0,0,.12), 0 20px 40px rgba(0,0,0,.2); animation: cardIn .6s cubic-bezier(.34,1.56,.64,1); max-width:94%; }
.big-sticker{ font-size:118px; line-height:1.1; display:flex; justify-content:center; animation: jump 1s ease-in-out infinite; filter: drop-shadow(0 8px 8px rgba(0,0,0,.2)); }
.stars{ font-size:34px; display:flex; gap:6px; animation: bob 1.4s ease-in-out infinite; }
.stars span{ display:flex; }
#celebrate-book{ display:none; grid-template-columns: repeat(5, 1fr); gap:8px; font-size:40px; line-height:1.2; margin-top:10px; }
#celebrate-book.on{ display:grid; }
#celebrate-book span{ animation: jump 1.2s ease-in-out infinite; display:flex; justify-content:center; }
#next{ width:118px; height:118px; font-size:60px; background:var(--green); }

/* ---------- ART ---------- */
img.art{ display:block; width:1em; height:1em; object-fit:contain; pointer-events:none; -webkit-user-drag:none; }
.btn img.art{ width:58%; height:58%; }
#diffs .btn img.art{ width:66%; height:66%; }
#home-mascot img.art, #guide-face img.art{ width:1em; height:1em; }
.slot > img.art{ width:82%; height:82%; }
.slot.locked > img.art{ filter: grayscale(1) brightness(1.25); opacity:.3; }
.gb img.art{ width:78%; height:78%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.big-sticker img.art{ width:1em; height:1em; }
#celebrate-book img.art{ width:1em; height:1em; }
.slot .st{ position:absolute; left:0; right:0; bottom:3px; display:flex; justify-content:center; gap:1px; font-size:12px; line-height:1; pointer-events:none; transform:translateZ(0); }
.slot .st img.art{ display:block; width:13px; height:13px; }   /* explicit: the slot's animal rule would size these too */

/* ---------- MODE (animals / math) ---------- */
#modes{ display:flex; gap:10px; align-items:center; justify-content:center; }
.btn.mode{ min-width:0; min-height:54px; height:54px; border-radius:27px; padding:0 18px 0 10px; font-size:19px; font-weight:900; gap:8px; letter-spacing:.2px;
  background:rgba(255,255,255,.5); color:var(--ink); box-shadow:none; opacity:.8; transition: transform .2s cubic-bezier(.34,1.56,.64,1), opacity .2s, box-shadow .2s, background .2s; }
.btn.mode.on{ background:#fff; opacity:1; transform:scale(1.06); box-shadow: 0 5px 0 rgba(0,0,0,.14), 0 8px 16px rgba(0,0,0,.14); }
.btn.mode img.art{ width:38px; height:38px; }
.dots{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; max-width:112px; }
.dots i{ width:16px; height:16px; border-radius:50%; background:#2f7cff; box-shadow: inset -3px -3px 5px rgba(0,0,0,.2), inset 3px 3px 5px rgba(255,255,255,.5); }
.gb .q{ font-size:34px; font-weight:900; color:#fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
#speech .say.math{ font-size: clamp(24px, 7.6vw, 32px); letter-spacing:1px; }
/* ---------- DIFFICULTY ---------- */
#diffs{ display:flex; gap:12px; align-items:center; justify-content:center; margin-bottom:4px; }
#diffs{ align-items:flex-start; }
#diffs .btn{ min-width:60px; min-height:60px; width:60px; height:60px; font-size:30px; opacity:.72; transform:scale(.9); transition: transform .2s cubic-bezier(.34,1.56,.64,1), opacity .2s, box-shadow .2s; }
#diffs .btn.on{ opacity:1; transform:scale(1.18); box-shadow: 0 0 0 5px #fff, 0 5px 0 5px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.18); }
#diffs .btn[data-diff="hard"].on{ background:#ffb020; }
#diffs .btn[data-diff="expert"].on{ background:#ff4fa3; color:#fff; }

/* ---------- HEARTS + TIMER ---------- */
#row2{ width:100%; display:none; align-items:center; gap:10px; padding-right:92px; margin-top:8px; min-height:34px; }
#hud.hearts #row2{ display:flex; }
#hearts{ display:flex; gap:4px; align-items:center; }
.hp{ width:34px; height:34px; display:flex; filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s, filter .3s; }
.hp.lost{ filter: grayscale(1) brightness(1.4); opacity:.35; transform:scale(.8); }
.hp.hit{ animation: hitHeart .5s ease-out; }
#tbar{ flex:1; height:16px; background:rgba(255,255,255,.6); border-radius:12px; border:3px solid #fff; overflow:hidden; display:none; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
#hud.timer #tbar{ display:block; }
#tbar-fill{ height:100%; width:100%; border-radius:10px; background:linear-gradient(90deg,#7ce0ff,#2f7cff); }
#tbar-fill.low{ background:linear-gradient(90deg,#ff8a1f,#ff3b5c); }
.seq{ display:flex; align-items:center; gap:6px; }
.seq .gb{ width:44px; height:44px; opacity:.55; transform:scale(.9); }
.seq .gb::after{ left:8px; top:6px; width:10px; height:6px; }
.seq .gb.big{ width:64px; height:64px; opacity:1; transform:scale(1); box-shadow: inset -7px -9px 14px rgba(0,0,0,.18), inset 7px 7px 12px rgba(255,255,255,.55), 0 0 0 4px #fff, 0 3px 0 4px rgba(0,0,0,.1); }
.seq .gb.big::after{ left:12px; top:9px; width:14px; height:9px; }
.seq .arrow{ width:18px; height:18px; opacity:.55; }
.stars span{ transition: transform .3s; }
.stars span.dim{ opacity:.25; filter:grayscale(1); }
@keyframes hitHeart{ 0%{ transform:scale(1.6) rotate(-10deg) } 100%{ transform:scale(.8) } }
@keyframes talk{ 0%,100%{ transform:translateY(0) scale(1) } 35%{ transform:translateY(-16px) scale(1.1,.9) } 70%{ transform:translateY(0) scale(.94,1.08) } }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
@keyframes halo{ 0%{ transform:scale(.95); opacity:.9 } 100%{ transform:scale(1.28); opacity:0 } }
@keyframes popIn{ 0%{ transform:scale(0) } 70%{ transform:scale(1.18) } 100%{ transform:scale(1) } }
@keyframes jump{ 0%,100%{ transform:translateY(0) rotate(-5deg) } 50%{ transform:translateY(-16px) rotate(5deg) } }
@keyframes wiggle{ 0%,100%{ transform:rotate(0) } 25%{ transform:rotate(-14deg) } 75%{ transform:rotate(14deg) } }
@keyframes cardIn{ 0%{ transform:scale(.2); opacity:0 } 100%{ transform:scale(1); opacity:1 } }
@keyframes point{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(6px,-6px) } }
/* narrow phones: keep sticker slots at 80px+ */
@media (max-width:379px){
  .screen{ padding-left: calc(var(--sal) + 6px); padding-right: calc(var(--sar) + 6px); }
  #book{ padding:4px; gap:4px; border-radius:22px; }
  .slot{ border-radius:18px; }
  #modes{ width:100%; padding-right:84px; gap:6px; }   /* keep clear of the sound button */
  .btn.mode{ height:44px; font-size:15px; padding:0 10px 0 6px; gap:5px; }
  .btn.mode img.art{ width:30px; height:30px; }
}
/* short phones (iPhone SE and similar): shrink the home screen so nothing needs scrolling */
@media (max-height:620px){
  #home-top{ min-height:56px; margin-top:-8px; } #home-mascot{ font-size:48px; } h1{ font-size:24px; }
  #book{ gap:5px; padding:6px; margin:2px 0; max-width:330px; } .slot{ min-height:52px; border-radius:16px; }
  #play{ width:104px; height:104px; margin:0; }
  .btn.mode{ height:44px; font-size:16px; padding:0 14px 0 8px; } .btn.mode img.art{ width:30px; height:30px; }
  #diffs .btn{ min-width:48px; min-height:48px; width:48px; height:48px; } .dl{ font-size:13px; }
}
/* landscape: book and play side by side so nothing needs scrolling */
@media (max-height:460px){
  #home{ flex-direction:row; justify-content:center; align-items:center; gap:18px; }
  #home-top{ display:none; }
  #book{ width:auto; max-width:none; grid-template-columns: repeat(5, 1fr); gap:6px; padding:8px; margin:0; }
  .slot{ width:58px; min-height:58px; font-size:34px; border-radius:16px; }
  #play{ width:112px; height:112px; font-size:56px; margin:0; }
  #diffs{ flex-direction:column; gap:14px; margin:0; }
  #modes{ flex-direction:column; gap:8px; }
  .btn.mode{ height:46px; font-size:16px; }
  #row2{ margin-top:4px; }
  #guide{ margin-top:6px; } #speech{ min-height:64px; } #guide-face{ font-size:50px; }
  .dl{ display:none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <section id="home" class="screen on" aria-label="Home">
    <div id="home-top"><div id="home-mascot"><img class="art" src="art/owl.webp" alt="" data-fb="🦉"></div><h1>Bubble Pop Safari</h1></div>
    <div id="modes" aria-label="Game">
      <button class="btn mode on" data-mode="safari" data-testid="mode-safari" aria-label="Animals"><img class="art" src="art/lion.webp" alt="" data-fb="🦁"><span>Animals</span></button>
      <button class="btn mode" data-mode="math" data-testid="mode-math" aria-label="Math"><img class="art" src="art/math.webp" alt="" data-fb="➕"><span>Math</span></button>
    </div>
    <div id="book" aria-label="Sticker book"></div>
    <button id="play" class="btn" data-testid="play" aria-label="Play"><img class="art" src="art/next.webp" alt="" data-fb="▶"></button>
    <div id="diffs" aria-label="Difficulty">
      <div class="dopt"><button class="btn small" data-diff="easy" data-testid="diff-easy" aria-label="Easy"><img class="art" src="art/chick.webp" alt="" data-fb="🐣"></button><span class="dl">Easy</span></div>
      <div class="dopt"><button class="btn small" data-diff="hard" data-testid="diff-hard" aria-label="Hard"><img class="art" src="art/flame.webp" alt="" data-fb="🔥"></button><span class="dl">Hard</span></div>
      <div class="dopt"><button class="btn small" data-diff="expert" data-testid="diff-expert" aria-label="Expert"><img class="art" src="art/bolt.webp" alt="" data-fb="⚡"></button><span class="dl">Expert</span></div>
    </div>
  </section>

  <section id="hud" class="screen" aria-label="Play">
    <div class="hud-row">
      <button id="home-btn" class="btn small" data-testid="home" aria-label="Home"><img class="art" src="art/home.webp" alt="" data-fb="🏠"></button>
      <div id="bar"><div id="bar-fill"></div><div id="bar-stars"></div></div>
    </div>
    <div id="row2"><div id="hearts" data-testid="hearts"></div><div id="tbar"><div id="tbar-fill"></div></div></div>
    <div id="guide"><div id="guide-face"><img class="art" src="art/owl.webp" alt="" data-fb="🦉"></div><div id="speech"></div></div>
  </section>

  <section id="celebrate" class="screen" aria-label="Celebration">
    <div class="card">
      <div id="celebrate-sticker" class="big-sticker"></div>
      <div id="celebrate-book"></div>
      <div id="ctext">You did it!</div>
      <div class="stars" id="cstars"><span><img class="art" src="art/star.webp" alt="" data-fb="⭐"></span><span><img class="art" src="art/star.webp" alt="" data-fb="⭐"></span><span><img class="art" src="art/star.webp" alt="" data-fb="⭐"></span></div>
      <button id="next" class="btn" data-testid="next" aria-label="Next"><img class="art" src="art/next.webp" alt="" data-fb="➡️"></button>
    </div>
  </section>

  <div id="toast" aria-live="polite"></div>
  <button id="mute" class="btn small" data-testid="mute" aria-label="Sound on" aria-pressed="false"><img class="art" src="art/sound.webp" alt="" data-fb="🔊"></button>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'bps.v3', OLD_KEYS = ['bps.v2','bps.v1'];
const COLORS = {
  red:    ['#ff3b5c','#ffc0cb','#b8143a'],
  blue:   ['#2f7cff','#bcd6ff','#1b4fc2'],
  green:  ['#2fd15f','#c0f5cf','#178f3d'],
  yellow: ['#ffcc1a','#fff2b3','#c99400'],
  purple: ['#9b4dff','#dfc9ff','#6a22c9'],
  orange: ['#ff8a1f','#ffd9b3','#c45f00'],
  pink:   ['#ff5fc8','#ffcdea','#c22a8e'],
  bomb:   ['#4a3d6b','#8a7bb0','#1d1430']
};

    if(o.wob){ const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=o.wob; lg.gain.value=o.wobDepth||25; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+dur+0.05); }

const music = (()=>{

    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

    g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.2); }

  else if(kind==='sub'){ a=ri(2,hi); b=ri(1,a-1); ans=a-b; text=a+' − '+b+' = ?'; }
  else if(kind==='miss'){ ans=ri(1,hi-1); a=ri(1,hi-ans); text=a+' + ? = '+(a+ans); }
  else { const m=cur.kind==='mul'?hi:5; a=ri(1,m); b=ri(1,m); ans=a*b; text=a+' × '+b+' = ?'; }

    const nonT=bubbles.filter(b=>!b.isTarget).length;
    const wantT=forceTarget || (nonT>=2 && Math.random()<D.ratio);
    const g0=tgt();
    if(wantT){ color=g0.color||pick(cur.colors); animal=g0.animal||pick(cur.animals); }
    else{
      let g=0; do{ color=pick(cur.colors); animal=pick(cur.animals); }while(matches(color,animal) && ++g<30);
      if(D.bombs>0 && bombs<2 && (Math.random()<D.bombs || bombT>6)) bomb=true;   // never more than ~6 s without a bomb in hard/expert
      else if(D.shift>0 && Math.random()<D.shift) shift={ list:cur.colors, t:0.9+Math.random()*0.5 };
    }
    isTarget=!bomb && matches(color,animal);
  }
  if(bomb){ color='bomb'; animal='bomb'; num=null; isTarget=false; bombT=0; }
  const y = (y0!=null) ? y0 : H+r+8;
  const amp=10+Math.random()*18; let x0=W/2;
  for(let k=0;k<8;k++){
    const m=r+amp+6; x0=m+Math.random()*Math.max(1,W-2*m);
    if(!bubbles.some(b=>Math.abs(b.y-y)<b.r+r && Math.abs(b.x0-x0)<b.r+r-8)) break;
  }
  bubbles.push({ id:++uid, x0, x:x0, y, r, vy:-(38+Math.random()*30)*speedMul(), amp, freq:0.8+Math.random()*1.2, phase:Math.random()*6.283,
    color, animal, num, isTarget, bomb, shift, age:0, wig:0, alpha:1 });
}
function spawnAmbient(){
  const r=44; const amp=12+Math.random()*16, m=r+amp+6, x0=m+Math.random()*Math.max(1,W-2*m);
  bubbles.push({ id:++uid, x0, x:x0, y:H+r+8, r, vy:-(22+Math.random()*18), amp, freq:0.6+Math.random(), phase:Math.random()*6.283,
    color:pick(FREE.colors), animal:pick(STICKERS), isTarget:false, bomb:false, shift:null, age:0, wig:0, alpha:0.6 });
}

/* ---------- flow ---------- */
function cw(c){ return '<span class="cw" style="color:'+COLORS[c][2]+'">'+c.toUpperCase()+'</span>'; }
function goalText(){
  if(cur.math) return prob.text;
  if(cur.free) return 'Pop them all!';
  if(seq) return 'Pop '+seq.map(g=>g.animal ? g.animal.toUpperCase() : cw(g.color)).join(', then ')+'!';
  const thing = cur.animal ? cur.animal.toUpperCase()+(goal>1?'S':'') : (goal>1?'bubbles':'bubble');
  return 'Pop '+goal+' '+(cur.color?cw(cur.color)+' ':'')+thing+'!';
}
function beginPlay(r0){
  nextIn=0; doneIn=0; resume=null; shake=0;
  seq=buildSeq(); goal=cur.free?cur.count:cur.count+(seq?seq.length-1:0);
  progress=r0?r0.progress:0; hearts=r0?r0.hearts:D.hearts; mistakes=r0?r0.mistakes:0; timeLeft=D.timer;
  bubbles=[]; fx=[]; spawnT=0.3; bombT=0; screen='play'; prob=null; if(cur.math) newProblem();
  showScreens(['hud']); renderGoal(); updateBar(); renderHearts(); renderTimer(); measureHud();
  seedBubbles();
  guideTalk(); music.set('play'); toast(cur.free ? 'Free play!' : 'Round '+round, 1000);
}
function startPlay(n,r0){ round=n; cur=roundFor(n); beginPlay(r0); }
function startFree(){ round=11; cur=mode==='math'?MATH_FREE:FREE; beginPlay(); }
function startGame(){
  if(resume && resume.diff===diff && resume.mode===mode && !best[diff][resume.round]){ startPlay(resume.round, resume); return; }  // accidental Home tap costs nothing
  const n=nextUnfinished(); if(n) startPlay(n); else startFree();
}
function goHome(party){

  nextIn=0; doneIn=0; shake=0;

  music.set('home');

}
function starsFor(){ if(diff==='easy') return 3; return mistakes===0?3:(mistakes<=2?2:1); }
function unlockNow(){ if(!cur.free){ const s=starsFor(); if(!isUnlocked(round)) justEarned=round; if((best[diff][round]||0)<s){ best[diff][round]=s; save(); } } }
function completeRound(){
  if(screen!=='play') return;
  screen='celebrate'; celebrateAt=t;
  const final = !cur.free && round===10;
  unlockNow();
  const stars=starsFor();
  els.csticker.innerHTML = artTag(final ? 'trophy' : STICKERS[round-1]);
  els.cbook.classList.toggle('on', final);
  if(final){ els.cbook.innerHTML=STICKERS.map(a=>'<span>'+artTag(a)+'</span>').join(''); }
  [...els.cstars.children].forEach((s,i)=>s.classList.toggle('dim', i>=stars));
  showScreens(['hud','celebrate']);
  confettiBurst(true); if(final) sfx.party(); else sfx.fanfare();
  els.ctext.textContent = final ? 'All the stickers!' : (stars===3 && diff!=='easy' ? 'Perfect!' : pick(['You did it!','Amazing!','Super pop!','New sticker!']));
  music.set('off');
  nextIn = final?7:5.5;   // counted down in update(), so a hidden tab pauses it
}
function nextRound(){ nextIn=0; if(screen!=='celebrate') return; if(round>=10) goHome(true); else startPlay(round+1); }
function freeFill(){ confettiBurst(false); sfx.fanfare(); toast(pick(['Wow!','Super!','Pop pop pop!']), 1200); progress=0; updateBar(); }
/* a mistake in hard/expert costs a heart; with no hearts left the round simply starts over (never a game over) */
function penalty(why){
  mistakes++;
  if(D.hearts<=0 || cur.free) return;
  hearts--; renderHearts(true);
  if(hearts<=0) loseRound();
  else toast(why==='time' ? 'Faster!' : 'Oops!', 800);
}
function loseRound(){
  for(const b of bubbles) if(!b.bomb) addPop(b);
  bubbles=[]; progress=0; hearts=D.hearts; timeLeft=D.timer; spawnT=0.5; if(cur.math) newProblem();
  renderGoal(); updateBar(); renderHearts(); renderTimer(); guideOops(); sfx.lose();
  toast('Try again!', 1400);
  seedBubbles();
}

/* ---------- input ---------- */
function onTap(x,y){
  if(screen!=='play') return;
  let best=null, bd=1e9;
  for(const b of bubbles){ if(b.y>H+b.r*0.5) continue; const d=Math.hypot(b.x-x,b.y-y); if(d<=b.r+12 && d<bd){ bd=d; best=b; } }
  if(!best){ addSparkle(x,y); sfx.sparkle(); return; }
  if(best.bomb){
    bubbles.splice(bubbles.indexOf(best),1); addBoom(best); sfx.boom(); guideOops(); penalty('bomb'); return;
  }
  if(best.isTarget){
    bubbles.splice(bubbles.indexOf(best),1); addPop(best);
    if(progress<goal){
      progress++; updateBar(); sfx.pop(progress/goal); if(D.timer>0) timeLeft=Math.min(D.timer, timeLeft+4);
      if(progress>=goal){ if(cur.free) freeFill(); else { unlockNow(); doneIn=0.65; } }   // sticker is safe the moment the bar fills
      fx.push({type:'text', x:best.x, y:best.y-best.r, text:String(cur.math?best.num:progress), life:0.9, max:0.9});   // the count (or the answer) floats up from the bubble
      if(progress>=goal && !cur.free) showDone();   // round won: no next question before the celebration
      else if(cur.math){ newProblem(); renderGoal(); }
      else if(seq) renderGoal();
    } else sfx.pop(1);
  } else {
    best.wig=0.7; sfx.wrong(); guideOops(); if(D.hearts<=0||cur.free) toast('Oops!', 600); penalty('wrong');
  }
}
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(e.clientX, e.clientY); });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ---------- loop ---------- */
let tickT=0;
function update(dt){
  t+=dt;
  if(doneIn>0){ doneIn-=dt; if(doneIn<=0){ doneIn=0; completeRound(); } }
  if(nextIn>0){ nextIn-=dt; if(nextIn<=0){ nextIn=0; nextRound(); } }
  if(shake>0) shake-=dt;
  const playing = screen==='play';
  if(playing) bombT+=dt;
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.age+=dt; b.y+=b.vy*dt; b.x=b.x0+Math.sin(t*b.freq+b.phase)*b.amp; if(b.wig>0) b.wig-=dt;
    if(b.shift && playing){ b.shift.t-=dt; if(b.shift.t<=0){ b.shift.t=1.1; const l=b.shift.list; b.color=l[(l.indexOf(b.color)+1)%l.length]; b.gen=-1; } }
    if(playing && b.alpha===1 && (cur.math || !cur.free)) b.isTarget=!b.bomb && (cur.math ? b.num===prob.ans : matches(b.color,b.animal));   // ordered goals and colour shifts change who is a target
    if(b.y < (playing ? hudB-b.r : -b.r*1.6)) bubbles.splice(i,1); }   // gone once fully under the guide pill
  spawnT-=dt;
  if(playing && progress<goal){
    let targets=0; for(let i=0;i<bubbles.length;i++){ const b=bubbles[i]; if(b.isTarget && b.y>hudB && b.y<H+b.r*0.5) targets++; }   // only ones a child can see
    const need=targets<D.minT, mx=maxBubbles();
    if((need && bubbles.length<mx+2) || (spawnT<=0 && bubbles.length<mx)){ spawnBubble(need); spawnT=(0.55+Math.random()*0.5)/speedMul(); }
    if(D.timer>0 && !cur.free && doneIn<=0){
      timeLeft-=dt; renderTimer();
      if(timeLeft<5){ tickT-=dt; if(tickT<=0){ tickT=1; sfx.tock(); } }
      if(timeLeft<=0){ timeLeft=D.timer; renderTimer(); sfx.wrong(); guideOops(); penalty('time'); }
    }
  } else if(screen==='home'){
    if(spawnT<=0 && bubbles.length<6){ spawnAmbient(); spawnT=1.1; }
  }
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life-=dt; if(f.life<=0){ fx.splice(i,1); continue; }
    if(f.parts){ const gr=f.type==='stars'?520:700; for(const p of f.parts){ p.vy+=gr*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.vr!==undefined) p.rot+=p.vr*dt; } } }
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i]; c.life-=dt; if(c.life<=0||c.y>H+30){ confetti.splice(i,1); continue; }
    c.vy+=260*dt; c.vy*=0.985; c.vx*=0.985; c.wob+=dt*4; c.x+=(c.vx+Math.sin(c.wob)*40)*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; }
}
function drawBubble(b){
  if(b.gen!==gen){ b.gen=gen; b.spr=b.animal?sprite(b.animal,Math.round(b.r*(b.bomb?1.4:1.15))):null; b.grad=bubbleGrad(b.color,b.r); }
  let a=b.alpha; if(screen==='play' && hudB>0 && b.y<hudB+b.r) a*=clamp((b.y-(hudB-b.r))/(2*b.r),0,1);   // fade under the HUD
  let s=b.age<0.4?easeOutBack(b.age/0.4):1;
  const sq=Math.sin(t*2.6+b.phase)*0.045;
  let sx=s*(1+sq), sy=s*(1-sq), dx=0;
  if(b.wig>0){ const w=b.wig, k=Math.sin(w*34)*w; dx=k*16; sx*=1+0.2*k; sy*=1-0.2*k; }
  ctx.save(); ctx.translate(b.x+dx,b.y); ctx.scale(sx,sy);
  if(a<1) ctx.globalAlpha=a;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,6.2832); ctx.fillStyle=b.grad; ctx.fill();
  if(b.bomb){ ctx.lineWidth=4; ctx.strokeStyle='rgba(255,70,70,'+(0.45+0.45*Math.sin(t*9+b.phase))+')'; ctx.stroke(); }
  else if(b.shift){ ctx.lineWidth=4; ctx.strokeStyle='hsl('+((t*260+b.phase*60)%360)+',95%,62%)'; ctx.stroke(); }
  else { ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.stroke(); }
  if(b.num!=null){   // math bubble: a big number
    const txt=String(b.num), fs=Math.round(b.r*(txt.length<2?1.15:txt.length<3?0.95:0.72));
    ctx.font='900 '+fs+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(3,fs*0.16); ctx.lineJoin='round'; ctx.strokeStyle='rgba(43,43,69,.85)'; ctx.strokeText(txt,0,fs*0.06); ctx.fillStyle='#fff'; ctx.fillText(txt,0,fs*0.06);
  } else {
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,b.r*0.97,0,6.2832); ctx.clip();   // the animal sits inside the bubble
    drawSprite(b.spr,0,b.r*0.08,1,a); ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(-b.r*0.42,-b.r*0.46,b.r*0.2,b.r*0.11,-0.6,0,6.2832); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
  ctx.restore();
}
function drawFx(f){
  const p=1-f.life/f.max;
  if(f.type==='ring'){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1+p*1.7),0,6.2832); ctx.strokeStyle=f.color; ctx.globalAlpha=1-p; ctx.lineWidth=2+7*(1-p); ctx.stroke(); ctx.globalAlpha=1; }
  else if(f.type==='flash'){ ctx.globalAlpha=(1-p)*0.9; ctx.fillStyle=f.color||'#fff7b0'; starPath(f.x,f.y,f.r*(0.9+p*1.6),f.r*(0.4+p*0.6),f.rot+p*1.2); ctx.fill(); ctx.globalAlpha=1; }
  else if(f.type==='stars'){ ctx.globalAlpha=Math.min(1,f.life/0.3); for(const q of f.parts){ ctx.fillStyle=q.color; starPath(q.x,q.y,q.size,q.size*0.45,q.rot); ctx.fill(); } ctx.globalAlpha=1; }
  else if(f.type==='drops'){ ctx.globalAlpha=1-p; ctx.fillStyle=f.color; for(const q of f.parts){ ctx.beginPath(); ctx.arc(q.x,q.y,q.size*(1-p*0.5),0,6.2832); ctx.fill(); } ctx.globalAlpha=1; }
  else if(f.type==='text'){ const a=p<0.6?1:1-(p-0.6)/0.4, sc=1+0.5*Math.sin(Math.min(1,p*2)*Math.PI/2);
    ctx.save(); ctx.translate(f.x,f.y-p*70); ctx.scale(sc,sc); ctx.globalAlpha=a; ctx.font='900 40px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=7; ctx.lineJoin='round'; ctx.strokeStyle='#1f78c8'; ctx.strokeText(f.text,0,0); ctx.fillStyle='#fff'; ctx.fillText(f.text,0,0); ctx.restore(); }
  else if(f.type==='animal'){ const yOff=-Math.sin(Math.min(1,p*1.2)*Math.PI)*80-p*40; const sc=1+0.7*Math.sin(Math.min(1,p*1.6)*Math.PI/2); const a=p<0.65?1:1-(p-0.65)/0.35;
    if(f.gen!==gen){ f.gen=gen; f.spr=sprite(f.name,Math.round(f.size)); }
    ctx.save(); ctx.translate(f.x,f.y+yOff); ctx.rotate(Math.sin(p*12)*0.15*(1-p)); drawSprite(f.spr,0,0,sc,a); ctx.restore(); }
}
function draw(){
  const k=shake>0?shake/0.4:0, ox=k?(Math.random()-.5)*16*k:0, oy=k?(Math.random()-.5)*16*k:0;
  ctx.setTransform(dpr,0,0,dpr,ox*dpr,oy*dpr);
  ctx.fillStyle=sky; ctx.fillRect(-20,-20,W+40,H+40);
  // sun + hills
  ctx.fillStyle='rgba(255,236,120,.35)'; ctx.beginPath(); ctx.arc(W-30,H*0.13,86,0,6.2832); ctx.fill();
  ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(W-30,H*0.13,58,0,6.2832); ctx.fill();
  ctx.fillStyle='#9ee87f'; ctx.beginPath(); ctx.ellipse(W*0.25,H+30,W*0.55,80,0,0,6.2832); ctx.fill();
  ctx.fillStyle='#7fd96a'; ctx.beginPath(); ctx.ellipse(W*0.85,H+40,W*0.5,70,0,0,6.2832); ctx.fill();
  for(let i=0;i<bubbles.length;i++) drawBubble(bubbles[i]);
  for(let i=0;i<fx.length;i++) drawFx(fx[i]);
  for(let i=0;i<confetti.length;i++){ const c=confetti[i], cs=Math.cos(c.rot), sn=Math.sin(c.rot);
    ctx.setTransform(dpr*cs,dpr*sn,-dpr*sn,dpr*cs,(c.x+ox)*dpr,(c.y+oy)*dpr);   // one transform per piece, no save/restore
    ctx.fillStyle=c.color; ctx.globalAlpha=Math.min(1,c.life);
    if(c.shape===1){ ctx.beginPath(); ctx.arc(0,0,c.w*0.45,0,6.2832); ctx.fill(); } else if(c.shape===2){ starPath(0,0,c.w*0.8,c.w*0.35,0); ctx.fill(); } else ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.wob))); }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1;
}
let last=performance.now();
let frameErr=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden){ try{ update(dt); draw(); }catch(e){ if(!frameErr){ frameErr=true; console.error('Bubble Pop frame error', e); } } }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', ()=>{
  last=performance.now();
  if(document.hidden){   // phone in a pocket: go quiet, timers are dt-based so they wait too
    try{ if(ac && ac.state==='running') ac.suspend().catch(()=>{}); }catch(e){}
  } else {
    try{ if(ac && ac.state==='suspended') ac.resume().catch(()=>{}); }catch(e){}
  }
});
window.addEventListener('pageshow', ()=>{ last=performance.now(); });
requestAnimationFrame(frame);

/* ---------- init ---------- */
resize();
round=nextUnfinished()||1; cur=roundFor(round); goal=cur.count;
renderBook(); renderMute(); showScreens(['home']);

/* ---------- PWA ---------- */
try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); } }catch(e){}

/* ---------- tiny test hook ---------- */
window.__bps = {
  state(){ const g=tgt(); return {
    screen, round, progress, goal, difficulty:diff, mode, hearts, mistakes, timeLeft:Math.round(timeLeft*10)/10, music:music.mode(),
    problem: prob ? { kind:prob.kind, text:prob.text, answer:prob.ans } : null,
    target: Object.assign({}, g.color?{color:g.color}:{}, g.animal?{animal:g.animal}:{}, {count:goal}),
    sequence: seq ? seq.slice() : null,
    unlocked: unlockedList(), best: JSON.parse(JSON.stringify(best)), muted,
    bubbles: screen==='play' ? bubbles.filter(b=>b.y>hudB&&b.y<=H&&b.x>=0&&b.x<=W).map(b=>({id:b.id, x:Math.round(b.x*10)/10, y:Math.round(b.y*10)/10, r:b.r, color:b.color, animal:b.animal, num:b.num, isTarget:b.isTarget, bomb:b.bomb, shift:!!b.shift})) : []
  }; },
  startGame(){ if(screen==='home') startGame(); },
  startRound(n){ if(screen==='home' && n>=1 && n<=10) startPlay(n); },
  setDifficulty(d){ setDifficulty(d, true); },
  setMode(m){ setMode(m, true); },
  resetProgress(){ bestAll={ safari:{ easy:{}, hard:{}, expert:{} }, math:{ easy:{}, hard:{}, expert:{} } }; best=bestAll[mode]; resume=null; if(screen==='home'){ round=1; cur=roundFor(1); goal=cur.count; progress=0; } save(); renderBook(); }
};
})();
</script>
